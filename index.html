<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Book Finder</title>
    <link rel="stylesheet" href="style.css" >
</head>


<body>
    <header>
        <h1>📖 Simple Book Finder</h1>
        <p> A website powered by a REST API </p>
    </header>
    <main>

        <!-- SEARCH -->
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search for a book...">
            <button onclick="searchBooks()"> Search </button>
            <button class="secondary" onclick="loadBooks()"> Show All </button>

        </section>

        <section>
            <h2>Books</h2>
            <div id="bookList" class="book-list">
                Loading books...
            </div>
        </section>
    </main>

    <footer>
        <p> Data provided by the Simple Book API </p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
